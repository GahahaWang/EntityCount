// Loader plugins are declared once here, so that every version project shares one copy of them.
plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddevgradle_version}" apply false
    id 'io.freefair.lombok' version "${lombok_version}" apply false
}

// One jar per Minecraft version for both loaders, made from its Fabric and NeoForge jars (the shared classes
// come from the Fabric jar): build/libs/EntityCount-multiloader-<mod_version>-<Minecraft version>.jar.
// :<version>:mergeLoaderJars builds one, buildAllVersions builds them all.
def merges = childProjects.values().findAll { it.findProject('fabric') && it.findProject('neoforge') }.collect { versionProject ->
    def mc = versionProject.name
    def loaders = [versionProject.project('fabric'), versionProject.project('neoforge')]
    versionProject.tasks.register('mergeLoaderJars', Jar) {
        group = 'build'
        description = "Merges the Fabric and NeoForge jars of Minecraft ${mc} into one jar for both loaders."
        dependsOn loaders.collect { "${it.path}:jar" }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        archiveFileName = "${archives_name}-multiloader-${mod_version}-${mc}.jar"
        destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
        loaders.each { loader -> from { zipTree(loader.tasks.named('jar', Jar).get().archiveFile) } }
    }
}

tasks.named('buildAllVersions') {
    dependsOn merges
}

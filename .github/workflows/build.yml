name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build every Minecraft version and loader
        run: ./gradlew buildAllVersions

      # One jar for both loaders per Minecraft version (build.gradle, mergeLoaderJars).
      - name: Upload the multiloader jars
        uses: actions/upload-artifact@v7
        with:
          name: EntityCount
          path: build/libs/EntityCount-multiloader-*.jar
          if-no-files-found: error
